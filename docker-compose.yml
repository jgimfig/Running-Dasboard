services:
  running-dashboard:
    build: .
    image: running-dashboard:latest
    container_name: running-dashboard
    ports:
      - "8050:8050"
    volumes:
      # Garmin .fit files + apple_health_export/ + activity_tags.json (never baked into the image).
      # Writable because the session tags are saved here.
      - ./fit_raw:/data
      # Apple Health parse cache, persisted across restarts
      - health-cache:/cache
    environment:
      # Optional HR zone overrides (bpm). Empty = auto (max of all sessions / 90-day median resting HR).
      HR_MAX: "${HR_MAX:-}"
      HR_REST: "${HR_REST:-}"
    restart: unless-stopped

volumes:
  health-cache:
